name: Test scenario
difficulty: 2
description: This is a test scenario
vlans:
  - id: 10
    name: Server
  - id: 20
    name: Phone
switches:
  - number: 1
    ports:
      - id: eth1/1/1
        mode: routed
        ip: 10.10.200.1/30
        ospf:
          area: 0
          p2p: true
        description: router,gi1/1
      - id: eth1/1/2
        untagged_vlan: 10
        description: Server1
        mtu: 9216
        config: |
          stp-bpdu-guard
          spanning-tree root-protect
      - id: eth1/1/3
        description: Void
        speed: 1000-full
        acl_in: Test_ACL
        acl_out: Test_ACL
      - id: lo0
        ip: 10.255.254.1/32
        description: Global loopback
        ospf:
          area: 0
          passive: true
    lag:
      - id: 10
        name: Uplink
        members:
          - eth1/1/47
          - eth1/1/48
        untagged_vlan: 2
        tagged_vlan: 10 20
        mtu: 9216
    ospf:
      areas:
        - area: 0
      router-id: 10.255.254.1
    acls:
      - name: Test_ACL
        lines:
          - permit icmp any 192.168.0.1/32
          - permit tcp any 192.168.0.1/32 eq 443
          - deny ip any any
  - number: 2
    ports:
      - id: eth1/1/1
        mode: routed
        ip: 10.10.200.5/30
        ospf:
          area: 0
          p2p: true
        description: router2,gi1/1
      - id: eth1/1/2
        untagged_vlan: 10
        description: Server2
        mtu: 9216
        config: |
          stp-bpdu-guard
          spanning-tree root-protect
      - id: lo0
        ip: 10.255.254.2/32
        description: Global loopback
        ospf:
          area: 0
          passive: true
    lag:
      - id: 10
        name: Uplink
        members:
          - eth1/1/47
          - eth1/1/48
        untagged_vlan: 2
        tagged_vlan: 10 20
        mtu: 9216
    ospf:
      areas:
        - area: 0
      router-id: 10.255.254.2
    bgp:
      local_asn: 65501
      router-id: 10.255.254.2
      neighbors:
        - ip_address: 10.10.200.2
          remote-as: 65530
        - ip_address: 2001:db8::32da:1
          remote-as: "1.5400"
      networks_ipv4:
        - 10.255.254.2/32
        - 172.24.1.0/24
      networks_ipv6:
        - 2001:db8::32da:0/64
